<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FAF8F2">
  <title>Page not found — God Focus</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      color: #1c1915;
      background: #faf8f2;
    }
    main { text-align: center; max-width: 22rem; }
    .eyebrow {
      margin: 0 0 0.5rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6b645a;
    }
    h1 { margin: 0 0 0.75rem; font-size: 1.75rem; font-weight: 600; }
    p { margin: 0 0 1rem; color: #6b645a; line-height: 1.45; }
    a {
      color: #2f5d50;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.95rem;
    }
  </style>
  <script>
    (function () {
      var path = (location.pathname || "").replace(/\/+/g, "/");
      // Only unknown /go/… codes soft-land on the main smart link.
      // Unrelated missing website URLs stay on this normal 404 page.
      if (/^\/go(\/|$)/i.test(path)) {
        location.replace("/go/");
      }
    })();
  </script>
</head>
<body>
  <main>
    <p class="eyebrow">God Focus</p>
    <h1>Page not found</h1>
    <p>That page isn’t on this site.</p>
    <p><a href="/">Back to God Focus</a></p>
  </main>
</body>
</html>
